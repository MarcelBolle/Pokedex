<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokedex</title>
    <link rel="icon" href="assets/pics/favicon.png" type="image/png">
    <link rel="stylesheet" href="style.css">

    <script src="script.js"></script>
    <script src="pokeApi.js"></script>

</head>

<body onload="initPokedex()">
    <div id="app-wrapper">
        <h1>Mein Pokedex</h1>

        <div class="search-container">
            <input type="text" id="search-input" placeholder="Pokémon suchen (z.B. pikachu)...">
            <button id="search-btn" onclick="searchPokemon()">Suchen</button>
            <button id="reset-btn" onclick="resetSearch()">X</button>
        </div>

        <div id="pokemon-grid">
        </div>

        <div id="loader" class="hidden"></div>

        <button id="load-more-btn" onclick="loadPokemonList()">Mehr laden</button>
    </div>

    <div id="pokemon-modal" class="hidden">
        <div class="modal-content" id="modal-content">
        </div>
    </div>

</body>

</html>
